name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Java 17 (requerido para Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Crear estructura web y configurar Capacitor
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MacroPlanner" "com.cristobal.macros" --web-dir www
          npx cap add android

      - name: 5. Compilar el archivo APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Subir APK lista para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MacroPlanner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
